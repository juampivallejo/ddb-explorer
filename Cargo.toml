[package]
name = "gpui-demo"
version = "0.1.0"
edition = "2024"
description = "A read-only DynamoDB explorer built with GPUI"
publish = false

[dependencies]
aws-config = "1"
aws-credential-types = "1"
aws-sdk-dynamodb = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
log = "0.4"
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
gpui-kit = { version = "=0.7.1", features = ["tree-sitter"] }
